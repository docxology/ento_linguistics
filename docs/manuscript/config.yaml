# Ento-Linguistic Research Paper Configuration
# This file contains metadata for the Ento-Linguistic analysis of scientific terminology in entomology

paper:
  title: "Ento-Linguistics: Language, Ambiguity, and Scientific Communication in Entomology"
  subtitle: "Descriptive Corpus Analysis and a Six-Domain Framework"
  version: "1.2.2-dev" # Unpublished editorial revision
  date: "2026-10-07 – Editorial draft 1.2.2-dev (unpublished)" # Rendered revision identity

# Author information
authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute, APOIDEAS" # Research institution
    corresponding: true # Mark corresponding author

  - name: "Tucker Cahill Chambers"
    orcid: "0009-0008-3793-7872"
    affiliation: "APOIDEAS"
    corresponding: false

# Publication information (optional)
publication:
  doi: "" # This unpublished draft has no assigned DOI
  version_doi: "" # No version DOI assigned to this local revision
  zenodo_record_url: "" # Published versions are linked in the repository documentation
  journal: "" # Journal name if published
  volume: "" # Journal volume
  pages: "" # Page numbers
  year: "" # Publication year (auto-generated if empty)

# Keywords for metadata
keywords:
  - "entomology"
  - "scientific terminology"
  - "language analysis"
  - "discourse analysis"
  - "ant biology"
  - "eusociality"
  - "conceptual frameworks"
  - "active inference"
  - "terminology networks"
  - "Markov blankets"
  - "stigmergy"
  - "computational linguistics"

# Additional metadata
metadata:
  abstract: "" # Can reference abstract section or leave empty
  acknowledgments: "" # Funding info, etc. (can reference acknowledgments section)
  license: "CC-BY-4.0" # Paper/media license; software license is separate
  language: "en" # Paper language code

# LLM Review Settings
llm:
  reviews:
    enabled: true
    types:
      - executive_summary # Default: single review
      # Uncomment to enable additional reviews:
      # - quality_review
      # - methodology_review
      # - improvement_suggestions
  translations:
    enabled: true # Set to false to disable translation generation
    languages:
      - zh # Chinese (Simplified)
      - hi # Hindi
      - ru # Russian

# Testing Configuration
# Maximum acceptable test failures before halting pipeline
# Priority: Environment variables > Config file > Default (0)
testing:
  max_test_failures: 0 # General maximum (default: 0 = strict, no failures allowed)
  max_infra_test_failures: 0 # Infrastructure test suite maximum (default: 0)
  max_project_test_failures: 0 # Project test suite maximum (default: 0)

